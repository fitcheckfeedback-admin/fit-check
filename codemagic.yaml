workflows:
  ios-workflow:
    name: FIT Check iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Check
    environment:
      node: 20.9.0
      vars:
        BUNDLE_ID: app.stylesense.fitcheck
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@10 --force
      - name: Install dependencies
        script: pnpm install
      - name: Build web app for Capacitor
        script: |
          cd artifacts/fit-check
          npm install @rollup/rollup-darwin-arm64 --save-optional 2>/dev/null || true
          CAPACITOR_BUILD=true pnpm run build
      - name: Add iOS platform
        script: |
          cd artifacts/fit-check
          npx cap add ios 2>/dev/null || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd artifacts/fit-check/ios/App
          pod install
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "artifacts/fit-check/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
