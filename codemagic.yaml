workflows:
    ios-workflow:
      name: FIT Check iOS
      max_build_duration: 120
      instance_type: mac_mini_m2
      integrations:
        app_store_connect: Fit Check
      environment:
        node: 22.12.0
        vars:
          BUNDLE_ID: app.stylesense.fitcheck
          WIDGET_BUNDLE_ID: app.stylesense.fitcheck.widget
          TEAM_ID: P6D4L2GJ75
      scripts:
        - name: Install pnpm
          script: npm install -g pnpm@10 --force
        - name: Install dependencies
          script: pnpm install --no-frozen-lockfile
        - name: Build web app
          script: |
            cd artifacts/fit-check
            CAPACITOR_BUILD=true pnpm exec vite build --config vite.config.ts
        - name: Sync Capacitor
          script: |
            cd artifacts/fit-check
            npx cap sync ios
        - name: Register local plugins
          script: |
            set -e
            # cap sync only scans node_modules for plugin classes, so our
            # app-target Swift plugins (VoiceTTS, FitCheckSnapshot, AppReview)
            # never land in packageClassList and the bridge never registers
            # them. Without this, isPluginAvailable() is false on device and
            # every plugin call silently falls back to the web implementation.
            python3 - <<'EOF'
            import json
            p = "artifacts/fit-check/ios/App/App/capacitor.config.json"
            with open(p) as f:
                cfg = json.load(f)
            needed = ["VoiceTTS", "FitCheckSnapshot", "AppReview"]
            lst = cfg.get("packageClassList") or []
            for n in needed:
                if n not in lst:
                    lst.append(n)
            cfg["packageClassList"] = lst
            with open(p, "w") as f:
                json.dump(cfg, f, indent="\t")
                f.write("\n")
            print("packageClassList now:", lst)
            missing = [n for n in needed if n not in lst]
            assert not missing, f"failed to register: {missing}"
            EOF
        - name: Set up signing
          script: |
            set -e
            keychain initialize
            python3 -c 'import base64; k=open("artifacts/fit-check/ios/cert_key.b64").read().strip(); pem=base64.b64decode(k).decode(); open("/tmp/cert_key.pem","w").write(pem)'
            export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project --verbose use-profiles --code-signing-setup-verbose-logging
        - name: Archive
          script: |
            set -o pipefail
            xcodebuild archive \
              -project artifacts/fit-check/ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath /tmp/App.xcarchive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              2>&1 | tee /tmp/xcodebuild_archive.log
            exit ${PIPESTATUS[0]}
        - name: Export IPA
          script: |
            mkdir -p build/ios/ipa
            xcodebuild -exportArchive \
              -archivePath /tmp/App.xcarchive \
              -exportPath build/ios/ipa \
              -exportOptionsPlist /Users/builder/export_options.plist
      artifacts:
        - build/ios/ipa/*.ipa
        - /tmp/xcodebuild_archive.log
        - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      publishing:
        app_store_connect:
          auth: integration
          submit_to_testflight: true
          submit_to_app_store: false
  