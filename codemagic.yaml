workflows:
  ios-workflow:
    name: FIT Check iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Check
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.stylesense.fitcheck
      node: 20.9.0
      vars:
        BUNDLE_ID: app.stylesense.fitcheck
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@10
      - name: Install dependencies
        script: pnpm install
      - name: Build web app for Capacitor
        script: |
          cd artifacts/fit-check
          CAPACITOR_BUILD=true pnpm run build
      - name: Add iOS platform
        script: |
          cd artifacts/fit-check
          npx cap add ios 2>/dev/null || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd artifacts/fit-check/ios/App
          pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles --profile-types app-store
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "artifacts/fit-check/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
