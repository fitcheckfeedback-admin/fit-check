workflows:
  ios-workflow:
    name: FIT Check iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Check
    environment:
      node: 22.12.0
      vars:
        BUNDLE_ID: app.stylesense.fitcheck
        TEAM_ID: P6D4L2GJ75
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@10 --force
      - name: Install dependencies
        script: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sync Capacitor
        script: |
          cd artifacts/fit-check
          npx cap sync ios
      - name: Set up signing
        script: |
          set -e
          keychain initialize

          echo "=== fetch-signing-files help ==="
          app-store-connect fetch-signing-files --help 2>&1 | grep -E "private|cert|key" || true

          echo "=== Decoding certificate key ==="
          python3 << 'PYEOF'
import base64
key_b64 = open('artifacts/fit-check/ios/cert_key.b64').read().strip()
key_pem = base64.b64decode(key_b64).decode('ascii')
open('/tmp/cert_key.pem', 'w').write(key_pem)
print('Key type:', key_pem.split('\n')[0])
print('Key length:', len(key_pem))
PYEOF

          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"

          echo "=== Running fetch-signing-files ==="
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --private-key @env:CERTIFICATE_PRIVATE_KEY
          echo "=== fetch-signing-files done ==="

          echo "=== Running keychain add-certificates ==="
          keychain add-certificates
          echo "=== keychain done ==="

          xcode-project use-profiles
      - name: Archive
        script: |
          set -o pipefail
          xcodebuild archive \
            -project artifacts/fit-check/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee /tmp/xcodebuild_archive.log
          exit ${PIPESTATUS[0]}
      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>P6D4L2GJ75</string>
          </dict>
          </plist>
          EOF
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
