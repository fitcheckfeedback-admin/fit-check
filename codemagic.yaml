workflows:
  ios-workflow:
    name: FIT Check iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Check
    environment:
      node: 22.12.0
      vars:
        BUNDLE_ID: app.stylesense.fitcheck
        TEAM_ID: P6D4L2GJ75
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@10 --force
      - name: Install dependencies
        script: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sync Capacitor
        script: |
          cd artifacts/fit-check
          npx cap sync ios
      - name: Set up signing
        script: |
          set -e
          keychain initialize

          # Revoke any existing distribution certs that have no matching private key
          pip3 install PyJWT cryptography --quiet 2>/dev/null || true
          python3 << 'PYEOF'
import os, time, json, urllib.request, sys
try:
    import jwt
    key_id = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
    issuer_id = os.environ['APP_STORE_CONNECT_ISSUER_ID']
    private_key = os.environ['APP_STORE_CONNECT_PRIVATE_KEY']
    token = jwt.encode(
        {'iss': issuer_id, 'iat': int(time.time()), 'exp': int(time.time())+1200,
         'aud': 'appstoreconnect-v1'},
        private_key, algorithm='ES256', headers={'kid': key_id}
    )
    hdrs = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
    req = urllib.request.Request(
        'https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION',
        headers=hdrs)
    with urllib.request.urlopen(req) as r:
        certs = json.loads(r.read()).get('data', [])
    print(f'Found {len(certs)} existing distribution certificate(s) - revoking all')
    for cert in certs:
        cid = cert['id']
        urllib.request.urlopen(urllib.request.Request(
            f'https://api.appstoreconnect.apple.com/v1/certificates/{cid}',
            method='DELETE', headers=hdrs))
        print(f'Revoked {cid}')
except Exception as e:
    print(f'Revoke step skipped: {e}', file=sys.stderr)
PYEOF

          # Fetch or create fresh certificate and provisioning profile
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Add certificate + private key to keychain
          keychain add-certificates

          # Configure Xcode project to use the downloaded profiles
          xcode-project use-profiles
      - name: Archive
        script: |
          set -o pipefail
          xcodebuild archive \
            -project artifacts/fit-check/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee /tmp/xcodebuild_archive.log
          exit ${PIPESTATUS[0]}
      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>P6D4L2GJ75</string>
          </dict>
          </plist>
          EOF
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
