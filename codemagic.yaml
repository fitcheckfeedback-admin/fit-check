workflows:
  ios-workflow:
    name: FIT Check iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Check
    environment:
      node: 22.12.0
      vars:
        BUNDLE_ID: app.stylesense.fitcheck
        TEAM_ID: P6D4L2GJ75
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@10 --force
      - name: Install dependencies
        script: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sync Capacitor
        script: |
          cd artifacts/fit-check
          npx cap sync ios
      - name: Set up signing
        script: |
          set -e
          keychain initialize

          # Decode the key from the repo file (no env var paste issues)
          python3 -c "
          import base64
          key_b64 = open('artifacts/fit-check/ios/cert_key.b64').read().strip()
          key_pem = base64.b64decode(key_b64)
          open('/tmp/cert_key.pem', 'wb').write(key_pem)
          print('Key decoded OK, length:', len(key_pem))
          "

          # Verify it is a valid PEM key
          openssl pkey -in /tmp/cert_key.pem -check -noout

          # Revoke any existing iOS distribution certs so we can create a fresh one
          app-store-connect list-certificates \
            --type IOS_DISTRIBUTION \
            --json 2>/dev/null | python3 -c "
          import json, sys, subprocess
          try:
              for cert in json.load(sys.stdin):
                  cid = cert.get('id', '')
                  if cid:
                      print('Revoking cert:', cid)
                      subprocess.run(['app-store-connect', 'revoke-certificate', cid],
                                     capture_output=True)
          except Exception as e:
              print('Revoke step skipped:', e)
          " || true

          # Fetch or create the distribution certificate and provisioning profile
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --private-key @file:/tmp/cert_key.pem

          # Add certificate to keychain
          keychain add-certificates

          # Configure Xcode project to use the downloaded profiles
          xcode-project use-profiles
      - name: Archive
        script: |
          set -o pipefail
          xcodebuild archive \
            -project artifacts/fit-check/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee /tmp/xcodebuild_archive.log
          exit ${PIPESTATUS[0]}
      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>P6D4L2GJ75</string>
          </dict>
          </plist>
          EOF
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
