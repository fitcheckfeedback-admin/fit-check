workflows:
  ios-workflow:
    name: FIT Check iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Check
    environment:
      node: 22.12.0
      vars:
        BUNDLE_ID: app.stylesense.fitcheck
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@10 --force
      - name: Install dependencies
        script: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sync Capacitor
        script: |
          cd artifacts/fit-check
          npx cap sync ios
      - name: Fetch signing files and build IPA
        script: |
          set -e

          # 1. Set up keychain FIRST so private key can be stored during cert creation
          keychain initialize

          # 2. Fetch / create provisioning profile + cert (using our own private key)
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY

          # 3. Add certificates (private key is now in keychain)
          keychain add-certificates

          # 3. Pull profile UUID + team ID from the downloaded .mobileprovision
          PROFILE=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" \
            -name "*.mobileprovision" | head -1)
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print UUID" /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print TeamIdentifier:0" /tmp/profile.plist)

          echo "Team ID: $TEAM_ID"
          echo "Profile UUID: $PROFILE_UUID"

          # 4. Archive
          xcodebuild archive \
            -project artifacts/fit-check/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="iPhone Distribution"

          # 5. Export options plist
          cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

          # 6. Export IPA
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
