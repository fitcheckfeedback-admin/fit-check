<html lang="en">
  <head>

    <!-- PWA manifest -->

    <!-- Favicon & icons -->
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FIT✔️" />

    <!-- Theme -->
    <meta name="theme-color" content="#ff9500" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#f59e0b" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FIT✔️ — Your daily outfit check" />
    <meta property="og:description" content="Know exactly what to wear, every day. AI-powered outfit suggestions based on your local weather." />
    <meta property="og:image" content="https://style-sense-fitcheck.replit.app/opengraph.jpg" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FIT✔️ — Your daily outfit check" />
    <meta name="twitter:description" content="Know exactly what to wear, every day. AI-powered outfit suggestions based on your local weather." />
    <meta name="twitter:image" content="https://style-sense-fitcheck.replit.app/opengraph.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Capture install prompt before React mounts so we never miss the event -->
    <script>
      window.__installPromptEvent = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__installPromptEvent = e;
        window.dispatchEvent(new Event('installpromptready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
